services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orbit_control
    ports:
      - "5432:5432"
    volumes:
      - orbit-control-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orbit_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/orbit_control?schema=public
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      SPACE_API_MODE: ${SPACE_API_MODE:-live}
      SPACE_API_TIMEOUT_MS: ${SPACE_API_TIMEOUT_MS:-5000}
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed &&
             npm run start"

volumes:
  orbit-control-db:
