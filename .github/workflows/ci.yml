name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  static-quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orbit_control?schema=public
      NASA_API_KEY: DEMO_KEY
      SPACE_API_MODE: mock
      SPACE_API_TIMEOUT_MS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Quality gate - typecheck
        run: npm run typecheck -- --pretty false

      - name: Quality gate - lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest

    needs:
      - static-quality

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orbit_control?schema=public
      NASA_API_KEY: DEMO_KEY
      SPACE_API_MODE: mock
      SPACE_API_TIMEOUT_MS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Quality gate - production build
        run: npm run build

  api-tests:
    runs-on: ubuntu-latest

    needs:
      - static-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orbit_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbit_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orbit_control?schema=public
      NASA_API_KEY: DEMO_KEY
      SPACE_API_MODE: mock
      SPACE_API_TIMEOUT_MS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: Quality gate - API tests
        run: npm run test:api

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/
          if-no-files-found: ignore

  ui-tests:
    runs-on: ubuntu-latest

    needs:
      - build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orbit_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbit_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orbit_control?schema=public
      NASA_API_KEY: DEMO_KEY
      SPACE_API_MODE: mock
      SPACE_API_TIMEOUT_MS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Quality gate - UI tests
        run: npm run test:ui

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore

  quality-gates:
    runs-on: ubuntu-latest

    if: always()

    needs:
      - static-quality
      - build
      - api-tests
      - ui-tests

    steps:
      - name: Fail if any required gate failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: Quality gates passed
        run: echo "All required quality gates passed."
